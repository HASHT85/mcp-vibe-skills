<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VEIST HQ // TERMINAL</title>
    
    <!-- Google Fonts for Stitch / Marathon UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=JetBrains+Mono:wght@400;700;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />

    <!-- GLOBAL ERROR CATCHER - runs BEFORE any module JS -->
    <script>
      window.onerror = function(msg, url, line, col, error) {
        var el = document.getElementById('crash-display');
        if (!el) {
          el = document.createElement('div');
          el.id = 'crash-display';
          el.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#0B0F14;color:#D7FF2F;font-family:monospace;padding:40px;overflow:auto;';
          document.body.appendChild(el);
        }
        el.innerHTML += '<h1 style="color:#FF6A3D;font-size:20px">[ JS_CRASH ]</h1>' +
          '<pre style="color:#fff;white-space:pre-wrap;font-size:12px">' +
          msg + '\n' + url + ':' + line + ':' + col + '\n' +
          (error && error.stack ? error.stack : '') + '</pre><hr style="border-color:#333">';
        return true;
      };
      window.addEventListener('unhandledrejection', function(e) {
        var el = document.getElementById('crash-display');
        if (!el) {
          el = document.createElement('div');
          el.id = 'crash-display';
          el.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#0B0F14;color:#D7FF2F;font-family:monospace;padding:40px;overflow:auto;';
          document.body.appendChild(el);
        }
        el.innerHTML += '<h1 style="color:#FF6A3D;font-size:20px">[ PROMISE_REJECTION ]</h1>' +
          '<pre style="color:#fff;white-space:pre-wrap;font-size:12px">' +
          (e.reason ? (e.reason.stack || e.reason.message || String(e.reason)) : 'Unknown rejection') + '</pre><hr style="border-color:#333">';
      });
    </script>
  </head>
  <body class="bg-v-bg font-mono text-white antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
