services:
  orchestrator:
    build: .
    container_name: mcp-vibe-skills
    restart: unless-stopped
    environment:
      - PORT=8080
      - STORE_PATH=/data/store.json
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_OWNER=${GITHUB_OWNER}
      - ADMIN_USER=${ADMIN_USER}
      - ADMIN_PASS=${ADMIN_PASS}
      - WORKSPACE_ROOT=/workspace
      - PIPELINES_STORE=/data/pipelines.json
      - HOST_WORKSPACE_PATH=${HOST_WORKSPACE_PATH:-/opt/vibecraft/workspace}
    volumes:
      - orchestrator-data:/data
      - ${HOST_WORKSPACE_PATH:-/opt/vibecraft/workspace}:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vibecraft-api.rule=Host(`api.vibecraft.hach.dev`)"
      - "traefik.http.routers.vibecraft-api.entrypoints=websecure"
      - "traefik.http.routers.vibecraft-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.vibecraft-api.loadbalancer.server.port=8080"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  dashboard:
    build: ./dashboard
    container_name: mcp-vibe-dashboard
    restart: unless-stopped
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vibecraft-dashboard.rule=Host(`vibecraft.hach.dev`)"
      - "traefik.http.routers.vibecraft-dashboard.entrypoints=websecure"
      - "traefik.http.routers.vibecraft-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.services.vibecraft-dashboard.loadbalancer.server.port=80"
    healthcheck:
      disable: true

volumes:
  orchestrator-data:
    driver: local

networks:
  web:
    external: true

