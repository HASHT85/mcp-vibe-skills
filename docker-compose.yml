services:
  orchestrator:
    build:
      context: .
      args:
        CACHE_BUSTER: "20260316-2230"
    container_name: veist
    restart: unless-stopped
    environment:
      - PORT=8080
      - STORE_PATH=/data/store.json
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_OWNER=${GITHUB_OWNER}
      - ADMIN_USER=${ADMIN_USER}
      - ADMIN_PASS=${ADMIN_PASS}
      - WORKSPACE_ROOT=/workspace
      - PIPELINES_STORE=/data/pipelines.json
      - HOST_WORKSPACE_PATH=${HOST_WORKSPACE_PATH:-/opt/veistcraft/workspace}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - HOSTINGER_API_TOKEN=${HOSTINGER_API_TOKEN}
    volumes:
      - /opt/veistcraft/data:/data
      - ${HOST_WORKSPACE_PATH:-/opt/veistcraft/workspace}:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.veist-api.rule=Host(`api.veist.hach.dev`)"
      - "traefik.http.routers.veist-api.entrypoints=websecure"
      - "traefik.http.routers.veist-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.veist-api.loadbalancer.server.port=8080"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  dashboard:
    build:
      context: ./dashboard
      args:
        CACHE_BUSTER: "20260316-2230"
    container_name: veist-dashboard
    restart: unless-stopped
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.veist-dashboard.rule=Host(`veist.hach.dev`)"
      - "traefik.http.routers.veist-dashboard.entrypoints=websecure"
      - "traefik.http.routers.veist-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.services.veist-dashboard.loadbalancer.server.port=80"
    healthcheck:
      disable: true


networks:
  web:
    external: true

