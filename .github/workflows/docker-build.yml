name: Build, Push & Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push orchestrator
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ihachi/veist:latest
            ihachi/veist:${{ github.sha }}
          cache-from: type=gha,scope=orchestrator
          cache-to: type=gha,mode=max,scope=orchestrator

      - name: Build & push dashboard
        uses: docker/build-push-action@v6
        with:
          context: ./dashboard
          push: true
          tags: |
            ihachi/veist-dashboard:latest
            ihachi/veist-dashboard:${{ github.sha }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard

      # ─── Auto-deploy to Hostinger VPS ───
      - name: Deploy to VPS (pull & restart)
        run: |
          curl -s -X POST \
            "https://api.hostinger.com/api/vps/v1/virtual-machines/1287719/projects/veist/update" \
            -H "Authorization: Bearer ${{ secrets.HOSTINGER_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -o /dev/null -w "%{http_code}"
          echo ""
          echo "✅ Deploy triggered on Hostinger VPS"

      - name: Wait for deployment
        run: sleep 30

      - name: Verify deployment
        run: |
          STATUS=$(curl -s -X GET \
            "https://api.hostinger.com/api/vps/v1/virtual-machines/1287719/projects/veist/containers" \
            -H "Authorization: Bearer ${{ secrets.HOSTINGER_API_TOKEN }}" \
            -H "Content-Type: application/json")
          echo "$STATUS" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for c in data:
              print(f\"{c['name']}: {c['state']} ({c.get('health', 'n/a')})\")" || echo "$STATUS"
